name: Auto Tag on Push to Main

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all tags
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get latest tag and increment
        id: increment_tag
        run: |
          # Fetch all tags
          git fetch --tags
          
          # Get the latest v1.0.x tag
          LATEST_TAG=$(git tag -l "v1.0.*" | sort -V | tail -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            # No existing v1.0.x tags, start with v1.0.0
            NEW_TAG="v1.0.0"
          else
            # Extract the patch version (x in v1.0.x)
            PATCH_VERSION=$(echo $LATEST_TAG | sed 's/v1.0.//')
            # Increment the patch version
            NEW_PATCH=$((PATCH_VERSION + 1))
            NEW_TAG="v1.0.$NEW_PATCH"
          fi
          
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $LATEST_TAG"
          echo "New tag: $NEW_TAG"
      
      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.increment_tag.outputs.new_tag }}
        run: |
          git tag $NEW_TAG
          git push origin $NEW_TAG

